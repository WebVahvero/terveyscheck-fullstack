services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: terveyscheck
      POSTGRES_USER: terveyscheck
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terveyscheck"]
      interval: 5s
      retries: 10

  web:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://terveyscheck:${POSTGRES_PASSWORD}@db:5432/terveyscheck
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data: